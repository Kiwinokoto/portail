services:
  portail:
    build:
      context: .
    image: portail-lgc:${PORTAIL_IMAGE_TAG:-local}
    container_name: portail_lgc
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORTAIL_HOST: 0.0.0.0
      PORTAIL_PORT: 8080
      PORTAIL_DATA_DIR: /app/data
      PORTAIL_PUBLIC_URL: https://portail.lagrandeclasse.fr
    volumes:
      - ./data:/app/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.portail-lgc.rule=Host(`portail.lagrandeclasse.fr`)
      - traefik.http.routers.portail-lgc.entrypoints=websecure
      - traefik.http.routers.portail-lgc.tls=true
      - traefik.http.routers.portail-lgc.tls.certresolver=letsencrypt
      - traefik.http.services.portail-lgc.loadbalancer.server.port=8080
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
    name: traefik_network
